<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&amp;display=swap');
      
      .logo-line1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 52px;
        font-weight: 700;
        fill: currentColor;
        letter-spacing: -0.5px;
      }
      
      .logo-line2 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 50px;
        font-weight: 800;
        fill: currentColor;
        letter-spacing: 4px;
      }

      .logo-dots {
        fill: #E84A5F;
      }
    </style>
  </defs>

  <!-- Line 1: Flore ... -->
  <text x="0" y="52" class="logo-line1">Flore</text>
  
  <!-- 3 Dots aligned after Flore -->
  <circle cx="160" cy="42" r="7" class="logo-dots" />
  <circle cx="182" cy="42" r="7" class="logo-dots" />
  <circle cx="204" cy="42" r="7" class="logo-dots" />

  <!-- Line 2: DJINOU (Slightly Bolder) -->
  <text x="0" y="115" class="logo-line2">DJINOU</text>
</svg>
