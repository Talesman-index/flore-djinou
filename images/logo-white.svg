<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap');
      
      .logo-line1 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 58px;
        font-weight: 400;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      
      .logo-line2 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 56px;
        font-weight: 400;
        fill: #FFFFFF;
        letter-spacing: 4px;
      }

      .logo-dots {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Line 1: Flore ... -->
  <text x="0" y="52" class="logo-line1">Flore</text>
  
  <!-- 3 White Dots aligned after Flore -->
  <circle cx="150" cy="40" r="7" class="logo-dots" />
  <circle cx="172" cy="40" r="7" class="logo-dots" />
  <circle cx="194" cy="40" r="7" class="logo-dots" />

  <!-- Line 2: DJINOU -->
  <text x="0" y="115" class="logo-line2">DJINOU</text>
</svg>
