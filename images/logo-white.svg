<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Cormorant+Garamond:wght@400;600;700&amp;display=swap');
      
      .logo-line1 {
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
        font-size: 42px;
        font-weight: 400;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      
      .logo-line2 {
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
        font-size: 40px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }

      .logo-dots {
        fill: #D32B2B;
      }
    </style>
  </defs>

  <!-- Line 1: Flore ... -->
  <text x="0" y="38" class="logo-line1">Flore</text>
  
  <!-- 3 Crimson Dots after Flore -->
  <circle cx="112" cy="30" r="5" class="logo-dots" />
  <circle cx="128" cy="30" r="5" class="logo-dots" />
  <circle cx="144" cy="30" r="5" class="logo-dots" />

  <!-- Line 2: DJINOU -->
  <text x="0" y="78" class="logo-line2">DJINOU</text>
</svg>
