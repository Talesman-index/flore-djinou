<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<link href='https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap' rel='stylesheet'>
<style>
  body {
    margin: 0;
    padding: 60px;
    background: #140324;
    display: inline-block;
  }
  .logo-box {
    display: flex;
    flex-direction: column;
    line-height: 0.92;
  }
  .logo-top {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 72px;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    letter-spacing: -0.015em;
  }
  .dots {
    display: inline-flex;
    gap: 10px;
    margin-left: 16px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #FFFFFF;
  }
  .logo-bottom {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 76px;
    color: #FFFFFF;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class='logo-box'>
    <div class='logo-top'>
      Flore
      <span class='dots'>
        <span class='dot'></span>
        <span class='dot'></span>
        <span class='dot'></span>
      </span>
    </div>
    <div class='logo-bottom'>DJINOU</div>
  </div>
</body>
</html>
